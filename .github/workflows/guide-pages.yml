name: Build guide on GitHub Pages
# Builds hardware/build-guide/dist from src and its checked current inputs.
# Kit qualification is reported separately. dist is never committed.
on:
  push:
    branches: [main]
    paths:
      - hardware/**
      - Makefile
      - scripts/**
      - tests/test_pages_checks.py
      - blooglyblob/**
      - .github/workflows/guide-pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check current inputs and report outstanding release reviews
        run: python scripts/check_pages.py
      - run: make guide-setup GUIDE_SYSTEM_DEPS=1
      - run: make guide-browser HOST_PYTHON=python
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: hardware/build-guide/dist
  deploy:
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
