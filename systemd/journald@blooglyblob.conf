# Only Blooglyblob's service output; leave the host's journal policy alone.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=64M
SystemMaxFileSize=4M
SystemKeepFree=512M
RuntimeMaxUse=8M
RuntimeMaxFileSize=1M
RuntimeKeepFree=32M
MaxRetentionSec=7day
MaxFileSec=1day
SyncIntervalSec=30s
RateLimitIntervalSec=30s
RateLimitBurst=1000
ForwardToSyslog=no
