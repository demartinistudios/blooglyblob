<!doctype html>
<html lang="en"><meta charset="utf-8"><title>BlooglyBlob social sharing card</title>
<!-- Source for hardware/build-guide/src/social-card.png. Render with `make guide-social-card` (1200 × 630, device scale 1, after fonts load). -->
<style>
@font-face { font-family: "Bricolage Grotesque"; src: url(../../build-guide/src/assets/fonts/BricolageGrotesque-Bold.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: Inter; src: url(../../build-guide/src/assets/fonts/InterVariable.woff2) format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #faf8f1; color: #292747; font-family: Inter, sans-serif; }
.card { position: relative; display: grid; grid-template-columns: 1fr 470px; gap: 56px; width: 1200px; height: 630px; padding: 56px 64px 56px 72px; }
.text { display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { width: 34px; height: 48px; }
.brand b { font: 700 34px "Bricolage Grotesque", sans-serif; letter-spacing: -.055em; }
.brand b span { color: #855037; }
.eyebrow { margin: 64px 0 16px; color: #855037; font-size: 17px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
h1 { margin: 0; font: 700 84px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.035em; }
.lede { margin: 26px 0 0; max-width: 29ch; color: #62616b; font-size: 27px; line-height: 1.45; }
.credit { margin-top: auto; color: #62616b; font-size: 18px; }
.credit b { color: #292747; }
figure { margin: 0; overflow: hidden; background: #f3f7fa; border-radius: 28px 28px 12px 12px; border-bottom: 5px solid #855037; }
figure img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; }
</style>
<main class="card">
  <div class="text">
    <div class="brand"><img src="../../build-guide/src/assets/robot-mark.svg" alt=""><b>Bloogly<span>Blob</span></b></div>
    <p class="eyebrow">Build guide</p>
    <h1>Meet BlooglyBlob.</h1>
    <p class="lede">An open-source, 3D-printed talking robot you can build yourself.</p>
    <p class="credit">A <b>DeMartini Studios</b> creation</p>
  </div>
  <figure><img src="../../build-guide/src/assets/r22/main-front.png" alt=""></figure>
</main>
</html>
