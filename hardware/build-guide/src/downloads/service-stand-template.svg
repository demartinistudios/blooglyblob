<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>BlooglyBlob service stand template, actual size</title>
<rect width="420" height="297" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="12" y="14" font-size="4" text-anchor="start" font-weight="bold" fill="#17232b">BlooglyBlob</text>
<text x="12" y="24" font-size="8" text-anchor="start" font-weight="bold" fill="#17232b">Wooden service stand: full-size template</text>
<text x="12" y="32" font-size="3.4" text-anchor="start" font-weight="normal" fill="#17232b">Print on A3 at 100% (actual size), or tile it, and check the 100 mm bar. All sizes are in millimetres,</text>
<text x="12" y="37.5" font-size="3.4" text-anchor="start" font-weight="normal" fill="#17232b">so you can also mark the parts out with a ruler and square. The stand is a workbench fixture, not part of the robot.</text>
<path d="M12 44H112V99H292V189H112V244H12Z" fill="#f6f1e7" stroke="black" stroke-width="0.4"/>
<rect x="34" y="61" width="58" height="30" fill="none" stroke="#51606b" stroke-width="0.3" stroke-dasharray="2 1.2"/>
<text x="63" y="67" font-size="3" text-anchor="middle" font-weight="normal" fill="#51606b">base block</text>
<rect x="34" y="197" width="58" height="30" fill="none" stroke="#51606b" stroke-width="0.3" stroke-dasharray="2 1.2"/>
<text x="63" y="224" font-size="3" text-anchor="middle" font-weight="normal" fill="#51606b">base block</text>
<rect x="225" y="127" width="36" height="34" fill="none" stroke="#51606b" stroke-width="0.3" stroke-dasharray="2 1.2"/>
<text x="243" y="124" font-size="3" text-anchor="middle" font-weight="normal" fill="#51606b">head riser</text>
<circle cx="49" cy="76" r="2.25" fill="white" stroke="black" stroke-width="0.3"/>
<path d="M45 76h8M49 72v8" stroke="black" stroke-width="0.15"/>
<circle cx="77" cy="76" r="2.25" fill="white" stroke="black" stroke-width="0.3"/>
<path d="M73 76h8M77 72v8" stroke="black" stroke-width="0.15"/>
<circle cx="49" cy="212" r="2.25" fill="white" stroke="black" stroke-width="0.3"/>
<path d="M45 212h8M49 208v8" stroke="black" stroke-width="0.15"/>
<circle cx="77" cy="212" r="2.25" fill="white" stroke="black" stroke-width="0.3"/>
<path d="M73 212h8M77 208v8" stroke="black" stroke-width="0.15"/>
<circle cx="243" cy="134" r="2.25" fill="white" stroke="black" stroke-width="0.3"/>
<path d="M239 134h8M243 130v8" stroke="black" stroke-width="0.15"/>
<circle cx="243" cy="154" r="2.25" fill="white" stroke="black" stroke-width="0.3"/>
<path d="M239 154h8M243 150v8" stroke="black" stroke-width="0.15"/>
<path d="M12 252H292" stroke="#17232b" stroke-width="0.25"/>
<path d="M12 250V254" stroke="#17232b" stroke-width="0.25"/>
<text x="12" y="258" font-size="3" text-anchor="middle" font-weight="normal" fill="#17232b">0</text>
<path d="M49 250V254" stroke="#17232b" stroke-width="0.25"/>
<text x="49" y="258" font-size="3" text-anchor="middle" font-weight="normal" fill="#17232b">37</text>
<path d="M77 250V254" stroke="#17232b" stroke-width="0.25"/>
<text x="77" y="258" font-size="3" text-anchor="middle" font-weight="normal" fill="#17232b">65</text>
<path d="M112 250V254" stroke="#17232b" stroke-width="0.25"/>
<text x="112" y="258" font-size="3" text-anchor="middle" font-weight="normal" fill="#17232b">100</text>
<path d="M243 250V254" stroke="#17232b" stroke-width="0.25"/>
<text x="243" y="258" font-size="3" text-anchor="middle" font-weight="normal" fill="#17232b">231</text>
<path d="M292 250V254" stroke="#17232b" stroke-width="0.25"/>
<text x="292" y="258" font-size="3" text-anchor="middle" font-weight="normal" fill="#17232b">280</text>
<text x="152" y="264" font-size="3" text-anchor="middle" font-weight="normal" fill="#17232b">Distances from the base end (holes: 37, 65 and 231)</text>
<text x="116" y="58" font-size="3.2" text-anchor="start" font-weight="normal" fill="#17232b">Crossbar 100 × 200</text>
<text x="116" y="64" font-size="3.2" text-anchor="start" font-weight="normal" fill="#17232b">Stem 180 long × 90 wide, centered</text>
<text x="116" y="70" font-size="3.2" text-anchor="start" font-weight="normal" fill="#17232b">Overall 280 × 200 × 18 plywood</text>
<text x="116" y="220" font-size="3.2" text-anchor="start" font-weight="normal" fill="#17232b">Block holes: 68 each side of the centerline</text>
<text x="116" y="226" font-size="3.2" text-anchor="start" font-weight="normal" fill="#17232b">Riser holes: 10 each side of the centerline</text>
<text x="116" y="232" font-size="3.2" text-anchor="start" font-weight="normal" fill="#17232b">Six Ø4.5 holes, countersunk Ø8.5 × about 3 deep underneath</text>
<text x="17" y="51" font-size="3.2" text-anchor="start" font-weight="bold" fill="#17232b">BASE END</text>
<text x="288" y="106" font-size="3.2" text-anchor="end" font-weight="bold" fill="#17232b">HEAD END</text>
<text x="62" y="146" font-size="3.2" text-anchor="middle" font-weight="bold" fill="#17232b">CUT OUTSIDE THE LINE</text>
<text x="312" y="50" font-size="3.4" text-anchor="start" font-weight="bold" fill="#17232b">Base block, make 2 (top view)</text>
<rect x="312" y="56" width="58" height="30" fill="#f6f1e7" stroke="black" stroke-width="0.35"/>
<circle cx="327" cy="71" r="1.5" fill="white" stroke="black" stroke-width="0.25"/>
<circle cx="355" cy="71" r="1.5" fill="white" stroke="black" stroke-width="0.25"/>
<text x="312" y="92" font-size="3" text-anchor="start" font-weight="normal" fill="#17232b">58 × 30 × 13 wood. Two Ø3 pilots, 28 apart,</text>
<text x="312" y="97" font-size="3" text-anchor="start" font-weight="normal" fill="#17232b">10 deep, in the face that sits on the bed.</text>
<text x="312" y="102" font-size="3" text-anchor="start" font-weight="normal" fill="#17232b">Glue a 58 × 30 × 2 soft foam pad on top.</text>
<text x="312" y="114" font-size="3.4" text-anchor="start" font-weight="bold" fill="#17232b">Head riser, make 1</text>
<text x="312" y="120" font-size="3" text-anchor="start" font-weight="normal" fill="#51606b">Bottom face</text>
<rect x="312" y="123" width="36" height="34" fill="#f6f1e7" stroke="black" stroke-width="0.35"/>
<circle cx="330" cy="130" r="1.5" fill="white" stroke="black" stroke-width="0.25"/>
<circle cx="330" cy="150" r="1.5" fill="white" stroke="black" stroke-width="0.25"/>
<text x="354" y="120" font-size="3" text-anchor="start" font-weight="normal" fill="#51606b">Side</text>
<rect x="354" y="123" width="34" height="70" fill="#f6f1e7" stroke="black" stroke-width="0.35"/>
<path d="M361 193V168M361 123V141" stroke="black" stroke-width="0.25" stroke-dasharray="1 0.8"/>
<path d="M381 193V168M381 123V141" stroke="black" stroke-width="0.25" stroke-dasharray="1 0.8"/>
<text x="391" y="150" font-size="3" text-anchor="start" font-weight="normal" fill="#17232b">70 tall</text>
<text x="391" y="138" font-size="2.8" text-anchor="start" font-weight="normal" fill="#51606b">top pilots</text>
<text x="391" y="142" font-size="2.8" text-anchor="start" font-weight="normal" fill="#51606b">18 deep</text>
<text x="391" y="183" font-size="2.8" text-anchor="start" font-weight="normal" fill="#51606b">bottom pilots</text>
<text x="391" y="187" font-size="2.8" text-anchor="start" font-weight="normal" fill="#51606b">25 deep</text>
<text x="312" y="202" font-size="3" text-anchor="start" font-weight="normal" fill="#17232b">Wood 70 × 36 × 34. Two Ø3 pilots, 20 apart, in</text>
<text x="312" y="207" font-size="3" text-anchor="start" font-weight="normal" fill="#17232b">each end, on the same centers. They don’t meet.</text>
<text x="312" y="219" font-size="3.4" text-anchor="start" font-weight="bold" fill="#17232b">Printed saddle J05: two 4 × 20 pan-head</text>
<text x="312" y="225" font-size="3" text-anchor="start" font-weight="normal" fill="#17232b">wood screws into the riser’s top pilots.</text>
<text x="312" y="230" font-size="3" text-anchor="start" font-weight="normal" fill="#17232b">Line its curved seat with about 4 mm soft foam.</text>
<text x="12" y="276" font-size="3.2" text-anchor="start" font-weight="normal" fill="#17232b">Screws, from underneath through the countersunk holes: 4 × 25 countersunk (blocks, 4) and 4 × 40 countersunk (riser, 2).</text>
<text x="12" y="282" font-size="3.2" text-anchor="start" font-weight="normal" fill="#17232b">Glue every wood-to-wood joint too. Keep all screw tips buried in the wood.</text>
<text x="12" y="288" font-size="3.2" text-anchor="start" font-weight="normal" fill="#17232b">Place the robot on its left side: base on the two pads, clear of the speaker grille, head in the saddle.</text>
<path d="M312 262H412M312 259V265M412 259V265" stroke="#17232b" stroke-width="0.35" fill="none"/>
<text x="362" y="269" font-size="3" text-anchor="middle" font-weight="normal" fill="#17232b">100 mm</text>
</g>
</svg>
