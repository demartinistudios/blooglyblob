<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 136" role="img" aria-labelledby="title desc">
  <title id="title">BlooglyBlob</title>
  <desc id="desc">An indigo robot with glowing cyan-white eyes, a rainbow smile, copper goggles and collar, and a spring antenna topped with a pale blue ball.</desc>
