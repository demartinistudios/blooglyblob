<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img"><title>HOW THE SOFTWARE FITS TOGETHER</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#875b46"/></marker></defs><rect width="1000" height="700" fill="#faf8f3"/><g font-family="Arial, sans-serif"><text x="36" y="53" font-size="30" fill="#292b3b" text-anchor="start">HOW THE SOFTWARE FITS TOGETHER</text><text x="36" y="96" font-size="20" fill="#292b3b" text-anchor="start">One application on one Raspberry Pi</text><rect x="35" y="160" width="230" height="120" rx="12" fill="#eeeaf5" stroke="#635c74" stroke-width="2"/><text x="57" y="200" font-size="23" fill="#292b3b" text-anchor="start">Button</text><text x="57" y="233" font-size="23" fill="#292b3b" text-anchor="start">USB microphone</text><rect x="365" y="145" width="260" height="150" rx="12" fill="#eeeaf5" stroke="#635c74" stroke-width="2"/><text x="387" y="185" font-size="23" fill="#292b3b" text-anchor="start">Raspberry Pi</text><text x="387" y="218" font-size="23" fill="#292b3b" text-anchor="start">BlooglyBlob app</text><rect x="735" y="150" width="230" height="140" rx="12" fill="#eeeaf5" stroke="#635c74" stroke-width="2"/><text x="757" y="190" font-size="23" fill="#292b3b" text-anchor="start">OpenAI</text><text x="757" y="223" font-size="23" fill="#292b3b" text-anchor="start">Internet connection</text><rect x="350" y="430" width="285" height="155" rx="12" fill="#eeeaf5" stroke="#635c74" stroke-width="2"/><text x="372" y="470" font-size="23" fill="#292b3b" text-anchor="start">Speakers via USB audio</text><text x="372" y="503" font-size="23" fill="#292b3b" text-anchor="start">16 LEDs</text><text x="372" y="536" font-size="23" fill="#292b3b" text-anchor="start">3 servos</text><rect x="35" y="430" width="230" height="155" rx="12" fill="#eeeaf5" stroke="#635c74" stroke-width="2"/><text x="57" y="470" font-size="23" fill="#292b3b" text-anchor="start">Setup computer</text><text x="57" y="503" font-size="23" fill="#292b3b" text-anchor="start">Install / update</text><text x="57" y="536" font-size="23" fill="#292b3b" text-anchor="start">via SSH</text><path d="M268,215 L355,215" stroke="#875b46" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M630,215 L725,215" stroke="#875b46" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M492,300 L492,418" stroke="#875b46" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M266,490 L352,279" stroke="#875b46" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="36" y="636" font-size="21" fill="#292b3b" text-anchor="start">Conversation, audio, lights and motion share the Pi application.</text><text x="36" y="667" font-size="21" fill="#292b3b" text-anchor="start">Startup can move servos: keep their power disconnected during first installation.</text></g></svg>