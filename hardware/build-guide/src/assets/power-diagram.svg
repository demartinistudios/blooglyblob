<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 833" width="420" height="833" role="img"><title>power-diagram.svg</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2f6fb5"/></marker></defs><rect x="0" y="0" width="420" height="833" rx="6" fill="#fbfaf6" stroke="none" stroke-width="2"/><text x="28" y="44" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#292b3b" font-weight="700" text-anchor="start">Power · three branches</text><text x="24" y="78" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">Reference schematic · no mains inside</text><text x="24" y="119" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Mean Well GST40A05-P1J</text><text x="24" y="148" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">External 5 V, 5 A supply</text><text x="24" y="177" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">→ J1 center → W1 INPUT +5 V</text><path d="M49 201 L49 614" fill="none" stroke="#c4302b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M49 238 L90 238" fill="none" stroke="#c4302b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="49" cy="238" r="8" fill="#b9c2c5" stroke="#c4302b" stroke-width="3"/><text x="104" y="246" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292b3b" font-weight="700" text-anchor="start">W1/2 → Pi power lead</text><text x="104" y="281" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292b3b" font-weight="400" text-anchor="start">Pi USB → audio</text><text x="104" y="316" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">Unfused supply branch</text><path d="M49 416 L90 416" fill="none" stroke="#c4302b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="49" cy="416" r="8" fill="#b9c2c5" stroke="#c4302b" stroke-width="3"/><text x="104" y="424" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292b3b" font-weight="700" text-anchor="start">W1/3 → W2/1</text><text x="104" y="459" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292b3b" font-weight="400" text-anchor="start">18 AWG → three servos</text><text x="104" y="494" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">C1 across W2 and W3</text><path d="M49 593 L90 593" fill="none" stroke="#c4302b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="49" cy="593" r="8" fill="#b9c2c5" stroke="#c4302b" stroke-width="3"/><text x="104" y="601" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292b3b" font-weight="700" text-anchor="start">W1/4 → F2 T1 A</text><text x="104" y="636" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#292b3b" font-weight="400" text-anchor="start">→ base half → body + head</text><text x="104" y="671" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">C2 across the base-half feed</text><text x="24" y="743" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">J1 sleeve → W3 GND</text><text x="24" y="772" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">W3/3 → 18 AWG link → W4/1</text><text x="24" y="801" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Both capacitors: 1000 µF · 10 V</text></svg>
