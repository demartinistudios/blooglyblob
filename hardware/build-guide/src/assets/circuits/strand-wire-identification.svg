<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 685" width="420" height="685" role="img"><title>circuits/strand-wire-identification.svg</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2f6fb5"/></marker></defs><rect x="0" y="0" width="420" height="685" rx="6" fill="#fbfaf6" stroke="none" stroke-width="2"/><text x="28" y="44" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#292b3b" font-weight="700" text-anchor="start">Strand · identify the wires</text><text x="24" y="78" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">Adafruit 6026 · inspect your strand</text><text x="24" y="129" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Clear insulation · enlarged detail</text><path d="M36 197 L384 197" fill="none" stroke="#d7d9d3" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M36 197 L384 197" fill="none" stroke="#aaa797" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M36 263 L384 263" fill="none" stroke="#d7d9d3" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M36 263 L384 263" fill="none" stroke="#aaa797" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M36 329 L384 329" fill="none" stroke="#d7d9d3" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M36 329 L384 329" fill="none" stroke="#aaa797" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M84 190 L92 204" fill="none" stroke="#875b46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M108 190 L116 204" fill="none" stroke="#875b46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M132 190 L140 204" fill="none" stroke="#875b46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M156 190 L164 204" fill="none" stroke="#875b46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M180 190 L188 204" fill="none" stroke="#875b46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M204 190 L212 204" fill="none" stroke="#875b46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M228 190 L236 204" fill="none" stroke="#875b46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M252 190 L260 204" fill="none" stroke="#875b46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M276 190 L284 204" fill="none" stroke="#875b46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="174" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#292b3b" font-weight="700" text-anchor="start">Copper coil / dots → +5 V</text><text x="24" y="242" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Middle wire → DATA (normally)</text><text x="24" y="309" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Other outer wire → GND</text><text x="24" y="387" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Trace each to its factory lead:</text><path d="M29 427 L99 427" fill="none" stroke="#c4302b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="121" y="435" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#292b3b" font-weight="700" text-anchor="start">red → +5 V</text><path d="M29 470 L99 470" fill="none" stroke="#397548" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="121" y="478" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#292b3b" font-weight="700" text-anchor="start">green → DATA</text><path d="M29 513 L99 513" fill="none" stroke="#26262b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="121" y="521" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#292b3b" font-weight="700" text-anchor="start">black → GND</text><text x="24" y="577" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Lots can differ. Stop if marks or</text><text x="24" y="606" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">colors are missing or disagree.</text><text x="24" y="635" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Connector sex does not show input.</text></svg>
