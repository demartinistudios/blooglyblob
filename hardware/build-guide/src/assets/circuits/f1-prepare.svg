<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 690" width="420" height="690" role="img"><title>circuits/f1-prepare.svg</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2f6fb5"/></marker></defs><rect x="0" y="0" width="420" height="690" rx="6" fill="#fbfaf6" stroke="none" stroke-width="2"/><text x="28" y="44" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#292b3b" font-weight="700" text-anchor="start">F1 · prepare the holder</text><text x="24" y="78" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">Schematic · power unplugged</text><path d="M55 190 L365 190" fill="none" stroke="#c4302b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect x="114" y="163" width="96" height="54" rx="17" fill="#202d38" stroke="#292b3b" stroke-width="2"/><rect x="210" y="163" width="96" height="54" rx="17" fill="#354653" stroke="#292b3b" stroke-width="2"/><path d="M132 172 L132 208" fill="none" stroke="#819098" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M145 172 L145 208" fill="none" stroke="#819098" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M158 172 L158 208" fill="none" stroke="#819098" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M263 172 L263 208" fill="none" stroke="#819098" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M276 172 L276 208" fill="none" stroke="#819098" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M289 172 L289 208" fill="none" stroke="#819098" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="210" y="143" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#292b3b" font-weight="700" text-anchor="middle">F1 · T3.15 A</text><path d="M55 190 L55 304 L365 304 L365 190" fill="none" stroke="#c4302b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="210" cy="304" r="21" fill="#fbfaf6" stroke="#c8601d" stroke-width="3"/><path d="M200 294 L220 314" fill="none" stroke="#c8601d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M220 294 L200 314" fill="none" stroke="#c8601d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="210" y="359" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="middle">Mark, then cut the loop once.</text><text x="24" y="412" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">INPUT: W1/3</text><text x="24" y="441" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">OUTPUT: W2/1</text><text x="24" y="470" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Dry-route both ends before cutting.</text><text x="24" y="499" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Keep the fuse out while wiring.</text><text x="24" y="566" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Factory loop: 18 AWG.</text><text x="24" y="595" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Output extension, if needed:</text><text x="24" y="624" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">18 AWG; solder and insulate.</text><text x="24" y="653" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Keep the holder opening accessible.</text></svg>
