<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 469" width="420" height="469" role="img"><title>circuits/wago-insert.svg</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2f6fb5"/></marker></defs><rect x="0" y="0" width="420" height="469" rx="6" fill="#fbfaf6" stroke="none" stroke-width="2"/><text x="28" y="44" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#292b3b" font-weight="700" text-anchor="start">Insert a WAGO wire</text><text x="24" y="78" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">221-415 · one wire per port</text><text x="24" y="121" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">1  Strip 11 mm; leave copper bare.</text><path d="M35 157 L229 157" fill="none" stroke="#c4302b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M229 157 L300 157" fill="none" stroke="#875b46" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M229 179 L300 179" fill="none" stroke="#5c6070" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="263" y="207" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="middle">11 mm</text><rect x="231" y="262" width="146" height="71" rx="8" fill="#dfded5" stroke="#8d939a" stroke-width="2"/><rect x="235" y="286" width="105" height="22" rx="2" fill="#55564f" stroke="#292b3b" stroke-width="2"/><path d="M316 275 L329 225 L345 229 L330 280 Z" fill="#ee8b35" stroke="#a25322" stroke-width="2"/><path d="M32 297 L157 297" fill="none" stroke="#c4302b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M157 297 L209 297" fill="none" stroke="#875b46" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M174 263 L222 263" fill="none" stroke="#2f6fb5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="24" y="245" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">2  Open</text><text x="24" y="369" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">3  Insert fully; close the lever.</text><text x="24" y="403" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Pull gently. It must stay in the port.</text><text x="24" y="432" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Do not tin the end.</text></svg>
