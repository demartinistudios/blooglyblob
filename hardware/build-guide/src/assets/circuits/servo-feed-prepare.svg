<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" width="420" height="470" role="img"><title>circuits/servo-feed-prepare.svg</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2f6fb5"/></marker></defs><rect x="0" y="0" width="420" height="470" rx="6" fill="#fbfaf6" stroke="none" stroke-width="2"/><text x="28" y="44" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#292b3b" font-weight="700" text-anchor="start">Prepare the servo feed</text><text x="24" y="78" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">One red 18 AWG wire</text><text x="24" y="130" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Test-route W1/3 → W2/1.</text><text x="24" y="159" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Cut to fit, allowing service access.</text><path d="M47 244 L91 244" fill="none" stroke="#875b46" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M91 244 L329 244" fill="none" stroke="#c4302b" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M329 244 L373 244" fill="none" stroke="#875b46" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M47 272 L91 272" fill="none" stroke="#5c6070" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="69.0" y="307" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="middle">11 mm</text><path d="M329 272 L373 272" fill="none" stroke="#5c6070" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="351.0" y="307" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="middle">11 mm</text><text x="24" y="378" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Strip both ends. Leave them bare.</text><text x="24" y="407" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Do not tin WAGO wire ends.</text></svg>
