<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 782" width="420" height="782" role="img"><title>circuits/head-data.svg</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2f6fb5"/></marker></defs><rect x="0" y="0" width="420" height="782" rx="6" fill="#fbfaf6" stroke="none" stroke-width="2"/><text x="28" y="44" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#292b3b" font-weight="700" text-anchor="start">Head · one chain</text><text x="24" y="78" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">Eyes 6–7 · mouth 8–15</text><text x="24" y="131" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Head half → eye input lead</text><text x="24" y="160" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">→ first eye IN. Either eye may be first.</text><rect x="50" y="199" width="84" height="84" rx="15" fill="#292f38" stroke="#292b3b" stroke-width="2"/><circle cx="92" cy="209" r="6" fill="#fbfaf6" stroke="#bfa768" stroke-width="2"/><circle cx="92" cy="273" r="6" fill="#fbfaf6" stroke="#bfa768" stroke-width="2"/><rect x="70" y="219" width="44" height="44" rx="4" fill="#f6f3e7" stroke="#a39d80" stroke-width="2"/><circle cx="92" cy="241" r="13" fill="#e7de90" stroke="#fff" stroke-width="2"/><text x="156" y="234" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#292b3b" font-weight="700" text-anchor="start">First eye</text><text x="156" y="267" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Light 6 · IN → OUT</text><path d="M92 284 L92 357" fill="none" stroke="#2f6fb5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="156" y="320" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#292b3b" font-weight="700" text-anchor="start">Eye cable</text><text x="156" y="352" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">OUT → IN</text><rect x="50" y="370" width="84" height="84" rx="15" fill="#292f38" stroke="#292b3b" stroke-width="2"/><circle cx="92" cy="380" r="6" fill="#fbfaf6" stroke="#bfa768" stroke-width="2"/><circle cx="92" cy="444" r="6" fill="#fbfaf6" stroke="#bfa768" stroke-width="2"/><rect x="70" y="390" width="44" height="44" rx="4" fill="#f6f3e7" stroke="#a39d80" stroke-width="2"/><circle cx="92" cy="412" r="13" fill="#e7de90" stroke="#fff" stroke-width="2"/><text x="156" y="405" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#292b3b" font-weight="700" text-anchor="start">Second eye</text><text x="156" y="438" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Light 7 · IN → OUT</text><path d="M92 455 L92 555" fill="none" stroke="#2f6fb5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="156" y="492" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#292b3b" font-weight="700" text-anchor="start">Mouth lead</text><text x="156" y="524" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">OUT → mouth</text><rect x="24" y="582" width="372" height="52" rx="5" fill="#2f413c" stroke="#292b3b" stroke-width="2"/><rect x="35" y="593" width="31" height="30" rx="3" fill="#f6f3e7" stroke="#adab8b" stroke-width="2"/><rect x="80" y="593" width="31" height="30" rx="3" fill="#f6f3e7" stroke="#adab8b" stroke-width="2"/><rect x="125" y="593" width="31" height="30" rx="3" fill="#f6f3e7" stroke="#adab8b" stroke-width="2"/><rect x="170" y="593" width="31" height="30" rx="3" fill="#f6f3e7" stroke="#adab8b" stroke-width="2"/><rect x="215" y="593" width="31" height="30" rx="3" fill="#f6f3e7" stroke="#adab8b" stroke-width="2"/><rect x="260" y="593" width="31" height="30" rx="3" fill="#f6f3e7" stroke="#adab8b" stroke-width="2"/><rect x="305" y="593" width="31" height="30" rx="3" fill="#f6f3e7" stroke="#adab8b" stroke-width="2"/><rect x="350" y="593" width="31" height="30" rx="3" fill="#f6f3e7" stroke="#adab8b" stroke-width="2"/><text x="120" y="570" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#292b3b" font-weight="700" text-anchor="start">Mouth · lights 8–15</text><text x="24" y="680" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Power and DATA follow the same</text><text x="24" y="709" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">path. Mouth DOUT stays unused.</text></svg>
