<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img"><title>circuits/shifter-neo.svg</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2f6fb5"/></marker></defs><rect x="0" y="0" width="420" height="420" rx="6" fill="#fbfaf6" stroke="none" stroke-width="2"/><text x="28" y="44" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#292b3b" font-weight="700" text-anchor="start">Cut both Neo jumpers</text><text x="24" y="78" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">Back of board · locate “Neo”</text><rect x="55" y="122" width="310" height="178" rx="12" fill="#273746" stroke="#292b3b" stroke-width="2"/><circle cx="280" cy="172" r="18" fill="#fbfaf6" stroke="#c5a571" stroke-width="5"/><text x="264" y="117" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="middle">Top hole</text><path d="M278 124 L280 149" fill="none" stroke="#5c6070" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="102" y="149" width="111" height="106" rx="4" fill="none" stroke="#fff" stroke-width="2"/><text x="157" y="180" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#fff" font-weight="400" text-anchor="middle">Neo</text><rect x="123" y="209" width="17" height="25" rx="2" fill="#dbb87a" stroke="#dbb87a" stroke-width="2"/><rect x="174" y="209" width="17" height="25" rx="2" fill="#dbb87a" stroke="#dbb87a" stroke-width="2"/><path d="M140 221 L174 221" fill="none" stroke="#dbb87a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M156 204 L160 238" fill="none" stroke="#c8601d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="266" y="270" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#fff" font-weight="400" text-anchor="middle">Cut here</text><path d="M224 256 L161 229" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="342" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Repeat on S1 and S2.</text><text x="24" y="371" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Check the cut is open with a meter.</text><text x="24" y="400" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Enlarged locator · not to scale</text></svg>
