<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 772" width="420" height="772" role="img"><title>circuits/capacitor-joint.svg</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2f6fb5"/></marker></defs><rect x="0" y="0" width="420" height="772" rx="6" fill="#fbfaf6" stroke="none" stroke-width="2"/><text x="28" y="44" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#292b3b" font-weight="700" text-anchor="start">C2 · cover the branch joint</text><text x="24" y="78" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">Bench detail · positive branch shown</text><text x="24" y="123" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">1 · Park tubing on the single wire.</text><text x="24" y="160" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">F2 · 18 AWG</text><path d="M32 209 L166 209" fill="none" stroke="#c4302b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><rect x="62" y="194" width="60" height="30" rx="5" fill="#626b72" stroke="#292b3b" stroke-width="2"/><path d="M166 209 L219 209" fill="none" stroke="#875b46" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M192 204 L237 204" fill="none" stroke="#875b46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M237 204 L293 204 L315 184 L380 184" fill="none" stroke="#c4302b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M192 216 L237 216" fill="none" stroke="#875b46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M237 216 L293 216 L315 244 L380 244" fill="none" stroke="#c4302b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="287" y="170" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="middle">Base-half + · 22 AWG</text><text x="254" y="280" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="middle">Insulated C2 + tail</text><text x="24" y="330" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">2 · Solder the three bare ends.</text><text x="24" y="359" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Both outgoing wires stay parallel</text><text x="24" y="388" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">through the sleeve.</text><path d="M32 455 L184 455" fill="none" stroke="#c4302b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><rect x="62" y="440" width="60" height="30" rx="5" fill="#626b72" stroke="#292b3b" stroke-width="2"/><rect x="172" y="445" width="75" height="24" rx="8" fill="#c2c9cb" stroke="#8d939a" stroke-width="2"/><path d="M241 450 L293 450 L315 432 L380 432" fill="none" stroke="#c4302b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M241 462 L293 462 L315 491 L380 491" fill="none" stroke="#c4302b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="541" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">3 · Cover metal; overlap insulation.</text><path d="M32 591 L211 591" fill="none" stroke="#c4302b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M211 586 L293 586 L315 568 L380 568" fill="none" stroke="#c4302b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M211 598 L293 598 L315 626 L380 626" fill="none" stroke="#c4302b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="149" y="574" width="127" height="34" rx="6" fill="#424b55" stroke="#292b3b" stroke-width="2"/><text x="24" y="682" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Make the return branch separately.</text><text x="24" y="711" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Insulate each capacitor leg-to-tail</text><text x="24" y="740" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">joint up to the capacitor’s seal.</text></svg>
