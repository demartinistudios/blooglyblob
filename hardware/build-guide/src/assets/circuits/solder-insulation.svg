<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 690" width="420" height="690" role="img"><title>circuits/solder-insulation.svg</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2f6fb5"/></marker></defs><rect x="0" y="0" width="420" height="690" rx="6" fill="#fbfaf6" stroke="none" stroke-width="2"/><text x="28" y="44" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#292b3b" font-weight="700" text-anchor="start">Solder and cover each joint</text><text x="24" y="78" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5c6070" font-weight="400" text-anchor="start">Bench detail · wires disconnected</text><text x="24" y="133" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">1 · Slide heat-shrink on first.</text><path d="M41 177 L153 177" fill="none" stroke="#c4302b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><rect x="68" y="164" width="53" height="26" rx="5" fill="#656c74" stroke="#292b3b" stroke-width="2"/><path d="M153 177 L187 177" fill="none" stroke="#875b46" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M238 177 L274 177" fill="none" stroke="#875b46" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M274 177 L376 177" fill="none" stroke="#c4302b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="263" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">2 · Join the bare ends; solder.</text><path d="M41 316 L172 316" fill="none" stroke="#c4302b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><rect x="68" y="303" width="53" height="26" rx="5" fill="#656c74" stroke="#292b3b" stroke-width="2"/><path d="M170 316 L251 316" fill="none" stroke="#875b46" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><rect x="183" y="308" width="55" height="16" rx="8" fill="#c2c9cb" stroke="#8d939a" stroke-width="2"/><path d="M252 316 L376 316" fill="none" stroke="#c4302b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="403" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">3 · Cover all bare metal; shrink.</text><path d="M41 453 L376 453" fill="none" stroke="#c4302b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><rect x="153" y="442" width="125" height="22" rx="6" fill="#424b55" stroke="#292b3b" stroke-width="2"/><text x="24" y="522" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Finished: sleeve overlaps insulation</text><text x="24" y="551" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">at both ends. Pull gently to check.</text><text x="24" y="612" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Use separately on +, − and DATA.</text><text x="24" y="641" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#292b3b" font-weight="400" text-anchor="start">Keep joints away from moving bends.</text></svg>
